<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NEXUS - Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 350px; }
    input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; }
    #msg { color: #fca5a5; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Iniciar Sesión</h2>
    
    <div id="paso-email">
      <label>Correo Electrónico:</label>
      <input type="email" id="loginEmail" placeholder="usuario@ejemplo.com">
      <button onclick="validarCorreo()">Continuar</button>
    </div>

    <div id="paso-password" style="display: none;">
      <label>Contraseña:</label>
      <input type="password" id="loginPassword">
      <button onclick="iniciarSesion()">Ingresar</button>
    </div>

    <p id="msg"></p>
  </div>

  <script>
    async function validarCorreo() {
      const email = document.getElementById('loginEmail').value;
      const msg = document.getElementById('msg');
      msg.innerText = '';

      const res = await fetch('/api/validar-email-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();
      if (res.ok && data.permitido) {
        document.getElementById('loginEmail').readOnly = true;
        document.getElementById('paso-password').style.display = 'block';
      } else {
        msg.innerText = data.error || 'Acceso no permitido';
      }
    }

    function iniciarSesion() {
      alert('Inicio de sesión ejecutado exitosamente.');
    }
  </script>
</body>
</html>
