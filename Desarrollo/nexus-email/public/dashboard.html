<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --accent-blue: #2563eb;
            --accent-cyan: #38bdf8;
            --accent-red: #dc2626;
            --accent-green: #16a34a;
            --text-main: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-primary);
            color: var(--text-main);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .btn-red {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            background: #0f172a;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .info-item span {
            display: block;
            font-size: 0.8em;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .info-item strong {
            font-size: 1em;
            color: var(--accent-cyan);
        }

        /* Contenedor y Tarjetas de Proyectos */
        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .project-card {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-cyan);
        }

        .project-badge {
            align-self: flex-start;
            background-color: rgba(37, 99, 235, 0.2);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-blue);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .project-title {
            font-size: 1.2em;
            margin: 0 0 10px 0;
            color: #fff;
        }

        .project-desc {
            font-size: 0.9em;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-project {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: background-color 0.2s;
        }

        .btn-project:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Dashboard del Sistema NEXUS</h2>
        <button class="btn-red" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- DATOS DE PERFIL -->
    <div class="card">
        <h3>Bienvenido(a), <span id="u_nombre" style="color: var(--accent-cyan);">Cargando...</span></h3>
        
        <div class="info-grid">
            <div class="info-item">
                <span>Correo Corporativo</span>
                <strong id="u_email">-</strong>
            </div>
            <div class="info-item">
                <span>Rol Asignado</span>
                <strong id="u_rol">-</strong>
            </div>
            <div class="info-item">
                <span>Cargo / Puesto</span>
                <strong id="u_cargo">-</strong>
            </div>
        </div>
    </div>

    <!-- ACCESO A PROYECTOS -->
    <div class="card">
        <h3>Módulos de Proyectos Asignados</h3>
        <div id="contenedor-proyectos" class="projects-container">
            <!-- Se carga dinámicamente según el proyecto asignado -->
        </div>
    </div>

    <script>
        const usuarioStr = localStorage.getItem('usuarioSesion');

        if (!usuarioStr) {
            alert('Sesión no iniciada.');
            window.location.href = 'index.html';
        } else {
            const usuario = JSON.parse(usuarioStr);
            document.getElementById('u_nombre').textContent = usuario.nombre || 'Usuario';
            document.getElementById('u_email').textContent = usuario.email || 'N/A';
            document.getElementById('u_rol').textContent = usuario.rol || 'N/A';
            document.getElementById('u_cargo').textContent = usuario.cargo || 'N/A';

            renderizarProyectos(usuario.proyecto);
        }

        function renderizarProyectos(proyecto) {
            const contenedor = document.getElementById('contenedor-proyectos');
            contenedor.innerHTML = '';

            const cardBigData = `
                <div class="project-card">
                    <div>
                        <span class="project-badge">ACCESO PERMITIDO</span>
                        <h4 class="project-title">Proyecto Big Data</h4>
                        <p class="project-desc">Módulo de análisis, gestión de consultas y procesamiento de grandes volúmenes de información en tiempo real.</p>
                    </div>
                    <a href="bigdata.html" class="btn-project">Ingresar al Proyecto Big Data</a>
                </div>
            `;

            const cardAzure = `
                <div class="project-card">
                    <div>
                        <span class="project-badge">ACCESO PERMITIDO</span>
                        <h4 class="project-title">Proyecto Azure Cloud</h4>
                        <p class="project-desc">Plataforma de infraestructura en la nube, despliegues y administración de recursos corporativos.</p>
                    </div>
                    <a href="azure.html" class="btn-project">Ingresar al Proyecto Azure</a>
                </div>
            `;

            if (proyecto === 'BIG_DATA') {
                contenedor.innerHTML = cardBigData;
            } else if (proyecto === 'AZURE') {
                contenedor.innerHTML = cardAzure;
            } else if (proyecto === 'AMBOS') {
                contenedor.innerHTML = cardBigData + cardAzure;
            } else {
                contenedor.innerHTML = '<p style="color: #94a3b8;">No tienes proyectos asignados actualmente.</p>';
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioSesion');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
